
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>
</head>
<body>
    <h1>Catálogo de Filmes</h1>

    <h2>Adicionar filme</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="titulo" placeholder="Título" required>
        <input type="text" name="diretor" placeholder="Diretor" required>
        <input type="number" name="ano" placeholder="Ano" required>
        <button type="submit">Adicionar</button>
    </form>

    <h2>Filmes cadastrados</h2>
    <ul>
        {% for filme in filmes %}
            <li>
                {{ filme.titulo }} - {{ filme.diretor }} ({{ filme.ano }})
                <a href="{% url 'editar_filme' id=filme.id %}">Editar</a>
                <form method="POST" action="{% url 'excluir_filme' id=filme.id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Excluir</button>
                </form>
            </li>
        {% empty %}
            <li>Nenhum filme cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
